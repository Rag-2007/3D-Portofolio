<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1e1b4b" opacity="0.9"/>
  <!-- Funnel/filter shape representing feature selection -->
  <polygon points="20,22 80,22 60,50 60,75 40,85 40,50" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linejoin="round"/>
  <!-- Input data dots -->
  <circle cx="28" cy="16" r="4" fill="#7c3aed"/>
  <circle cx="42" cy="16" r="4" fill="#7c3aed"/>
  <circle cx="56" cy="16" r="4" fill="#a78bfa"/>
  <circle cx="70" cy="16" r="4" fill="#7c3aed"/>
  <!-- Arrow down from funnel -->
  <line x1="50" y1="85" x2="50" y2="94" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="44,91 50,98 56,91" fill="#a78bfa"/>
  <!-- Selected feature dot (output) -->
  <circle cx="50" cy="60" r="5" fill="#c4b5fd"/>
</svg>
